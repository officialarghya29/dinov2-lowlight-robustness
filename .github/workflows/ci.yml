name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install analysis dependencies (CPU-only, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn scikit-image pyyaml
      - name: Run unit tests
        run: |
          python tests/run_tests.py
      - name: Verify experiment harness imports cleanly (torch optional)
        run: |
          python -c "import src.analysis, src.corruptions, src.probes, src.common; print('analysis stack OK')"
