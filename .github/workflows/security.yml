name: Security

on:
  schedule:
    # weekly, Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: ['requirements.txt', '.github/workflows/security.yml']
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit on the project requirements
        run: pip-audit -r requirements.txt --strict --progress-spinner off
